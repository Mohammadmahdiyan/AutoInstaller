```html<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browse Input</title>

<style>
    :root {
        /* =====================================================
           THEME
           رنگ اصلی برنامه را Theme برنامه تعیین می‌کند
           ===================================================== */

        --theme-color: #6366f1;
        --theme-text: #ffffff;

        --border-color: #d1d5db;
        --input-background: #ffffff;
        --input-text: #374151;

        --transition: 0.22s ease;
    }


    * {
        box-sizing: border-box;
    }


    body {
        margin: 0;
        padding: 40px;

        font-family: Arial, sans-serif;

        background: #f5f5f5;
    }


    .container {
        width: 100%;
        max-width: 800px;

        margin: auto;
    }


    .title {
        margin-bottom: 8px;

        font-size: 14px;
        font-weight: 600;

        color: #374151;
    }


    /* =========================================================
       INPUT GROUP
       ========================================================= */

    .input-group {
        display: flex;

        width: 100%;
        height: 46px;

        transition:
            border-radius var(--transition),
            padding var(--transition),
            border-color var(--transition);
    }


    /* =========================================================
       INPUT
       ========================================================= */

    .input-group input {
        flex: 1;

        min-width: 0;

        outline: none;

        padding: 0 12px;

        font-size: 14px;

        color: var(--input-text);

        background: var(--input-background);

        transition:
            border-radius var(--transition),
            border-color var(--transition),
            box-shadow var(--transition);
    }


    /* =========================================================
       BUTTON
       ========================================================= */

    .input-group button {
        flex-shrink: 0;

        cursor: pointer;

        border: none;

        font-size: 14px;
        font-weight: 500;

        padding: 0 20px;

        color: var(--theme-text);

        /* =====================================================
           مهم:
           رنگ دکمه از Theme برنامه می‌آید
           ===================================================== */
        background: var(--theme-color);

        transition:
            border-radius var(--transition),
            margin var(--transition),
            padding var(--transition),
            filter 0.15s ease,
            transform 0.05s ease;
    }


    .input-group button:hover {
        filter: brightness(0.92);
    }


    .input-group button:active {
        transform: translateY(1px);
    }


    /* =========================================================
       STYLE 3 — INSIDE BORDER
       
       حالت پیش‌فرض
       ========================================================= */

    .style-3 {
        padding: 3px;

        border: 1px solid var(--border-color);

        border-radius: 8px;

        background: var(--input-background);
    }


    .style-3 input {
        border: none;

        border-radius: 5px;
    }


    .style-3 input:focus {
        box-shadow: none;
    }


    .style-3 button {
        margin-left: 3px;

        border-radius: 5px;
    }


    /* =========================================================
       STYLE 5 — PILL
       
       بعد از کلیک روی Browse فعال می‌شود
       ========================================================= */

    .style-5 {
        padding: 0;

        border: none;

        border-radius: 22px;

        background: transparent;
    }


    .style-5 input {
        border: 1px solid var(--border-color);

        border-right: none;

        border-radius: 22px 0 0 22px;
    }


    .style-5 input:focus {
        border-color: var(--theme-color);

        box-shadow:
            0 0 0 1px var(--theme-color);

        z-index: 1;
    }


    .style-5 button {
        margin-left: 0;

        border: 1px solid var(--theme-color);

        border-radius: 0 22px 22px 0;

        padding-left: 24px;
        padding-right: 24px;
    }


    /* =========================================================
       DEMO
       ========================================================= */

    .demo {
        margin-bottom: 30px;
    }


    .hint {
        margin-top: 10px;

        font-size: 12px;

        color: #6b7280;
    }

</style>
</head>


<body>

<div class="container">

    <div class="demo">

        <div class="title">
            Browse
        </div>


        <!--
            حالت اولیه:
            Style 3 — Inside Border
        -->

        <div
            id="browseGroup"
            class="input-group style-3"
        >

            <input
                id="fileInput"
                type="text"
                placeholder="Select a file..."
                readonly
            >


            <button
                id="browseButton"
                type="button"
            >
                Browse
            </button>

        </div>


        <div class="hint">
            Click Browse to switch between Style 3 and Style 5.
        </div>

    </div>

</div>


<script>

    const browseGroup = document.getElementById("browseGroup");
    const browseButton = document.getElementById("browseButton");


    browseButton.addEventListener("click", () => {

        /*
         * =====================================================
         * تغییر بین:
         *
         * Style 3 → Style 5
         * Style 5 → Style 3
         * =====================================================
         */

        if (browseGroup.classList.contains("style-3")) {

            browseGroup.classList.remove("style-3");

            browseGroup.classList.add("style-5");

        } else {

            browseGroup.classList.remove("style-5");

            browseGroup.classList.add("style-3");

        }

    });

</script>

</body>
</html>
