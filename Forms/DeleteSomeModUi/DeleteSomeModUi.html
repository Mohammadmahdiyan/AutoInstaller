<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Mods</title>

  <style>
    :root {
      --blue: oklch(74.6% 0.16 232.661);

      --background: #08090b;
      --window: #101216;
      --item: #12151a;
      --hover: #181c22;
      --border: #272c34;

      --text: #f1f3f5;
      --muted: #858d99;

      --green: #35d07f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 50% 0%,
          color-mix(in oklch, var(--blue) 10%, transparent),
          transparent 45%),
        var(--background);

      font-family: "Segoe UI", Arial, sans-serif;

      color: var(--text);
    }

    /* =========================================================
         MAIN WINDOW
      ========================================================= */

    .window {
      width: 500px;
      max-width: calc(100vw - 24px);

      background: var(--window);

      border: 1px solid #22262d;
      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px rgba(255, 255, 255, 0.025);
    }

    .header {
      min-height: 64px;

      display: flex;
      align-items: center;

      padding: 0 20px;

      border-bottom: 1px solid var(--border);
    }

    .title {
      margin: 0;

      font-size: 16px;
      font-weight: 600;
    }

    /* =========================================================
         ITEMS
      ========================================================= */

    .table {
      overflow: hidden;
    }

    .item {
      min-height: 58px;

      display: flex;
      align-items: center;

      padding: 0 20px;

      background: var(--item);

      border-bottom: 1px solid var(--border);

      cursor: default;
      user-select: none;

      transition:
        background 0.22s ease,
        opacity 0.35s ease,
        transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
        max-height 0.45s ease,
        min-height 0.45s ease,
        padding 0.45s ease;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item:hover {
      background: var(--hover);
    }

    .item-text {
      flex: 1;

      color: #dfe3e8;

      font-size: 14px;
      font-weight: 500;

      transition:
        color 0.2s ease,
        opacity 0.3s ease;
    }

    .item:hover .item-text {
      color: #ffffff;
    }

    /* =========================================================
         DELETE
      ========================================================= */

    .delete-container {
      width: 32px;
      height: 32px;

      flex-shrink: 0;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .trash-button {
      width: 32px;
      height: 32px;

      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 8px;

      background: transparent;

      color: var(--muted);

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .trash-button:hover {
      background: #20242b;
      color: #ffffff;
    }

    .trash-button:active {
      transform: scale(0.94);
    }

    .trash-icon {
      width: 22px;
      height: 22px;

      display: block;

      overflow: visible;
    }

    .trash-body {
      transform-origin: 50% 40%;

      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .trash-lid {
      transform-origin: 12px 6px;

      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .item:hover .trash-lid {
      transform: translate(2px, -2px) rotate(14deg);
    }

    .item:hover .trash-body {
      transform: translateY(1px);
    }

    /* =========================================================
         CONFIRM
      ========================================================= */

    .confirm {
      position: absolute;

      right: 0;

      width: 158px;
      height: 34px;

      display: flex;
      align-items: center;

      gap: 5px;

      padding: 3px;

      border: 1px solid #303640;
      border-radius: 8px;

      background: #15181d;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);

      opacity: 0;
      visibility: hidden;

      transform: translateX(8px) scale(0.96);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0.2s ease;

      z-index: 20;
    }

    .confirm.show {
      opacity: 1;
      visibility: visible;

      transform: translateX(0) scale(1);
    }

    .confirm-text {
      flex: 1;

      padding-left: 5px;

      color: #cdd2d8;

      font-size: 10px;
      font-weight: 500;

      white-space: nowrap;
    }

    .confirm-button {
      height: 25px;

      padding: 0 8px;

      border: 1px solid #303640;
      border-radius: 5px;

      background: #1b1f25;

      color: #cdd2d8;

      font-family: inherit;
      font-size: 10px;

      cursor: pointer;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .confirm-button:hover {
      background: #252a31;
      color: #ffffff;
    }

    .confirm-button:active {
      transform: scale(0.94);
    }

    .confirm-button.yes:hover {
      color: var(--green);

      border-color: color-mix(in oklch, var(--green) 40%, #303640);
    }

    /* =========================================================
         PROGRESS
      ========================================================= */

    .progress {
      width: 26px;
      height: 26px;

      position: relative;

      display: none;

      align-items: center;
      justify-content: center;
    }

    .progress.show {
      display: flex;
    }

    .progress svg {
      width: 26px;
      height: 26px;

      transform: rotate(-90deg);
    }

    .progress-track,
    .progress-bar {
      fill: none;
      stroke-width: 2;
    }

    .progress-track {
      stroke: #2b3038;
    }

    .progress-bar {
      stroke: var(--blue);

      stroke-linecap: round;

      stroke-dasharray: 69.1;
      stroke-dashoffset: 69.1;
    }

    /* =========================================================
         SUCCESS
      ========================================================= */

    .success-check {
      width: 27px;
      height: 27px;

      display: none;

      align-items: center;
      justify-content: center;

      position: relative;

      border-radius: 50%;

      background: color-mix(in oklch, var(--green) 12%, transparent);

      box-shadow:
        0 0 0 1px color-mix(in oklch, var(--green) 35%, transparent),
        0 0 18px color-mix(in oklch, var(--green) 18%, transparent);
    }

    .success-check.show {
      display: flex;

      animation: successCircle 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .success-check::after {
      content: "";

      width: 6px;
      height: 11px;

      margin-top: -2px;

      border-right: 2px solid var(--green);

      border-bottom: 2px solid var(--green);

      transform: rotate(45deg) scale(0);

      animation: successTick 0.35s 0.18s cubic-bezier(0.2, 0.9, 0.2, 1.3) forwards;
    }

    @keyframes successCircle {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }

      60% {
        transform: scale(1.18);
        opacity: 1;
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes successTick {
      0% {
        transform: rotate(45deg) scale(0);
      }

      100% {
        transform: rotate(45deg) scale(1);
      }
    }

    .item.removing {
      pointer-events: none;

      opacity: 0;

      transform: translateX(-20px) scale(0.98);

      max-height: 0;
      min-height: 0;

      padding-top: 0;
      padding-bottom: 0;

      border-color: transparent;
    }

    .item.removing .item-text {
      opacity: 0;
    }

    /* =========================================================
         MEDIA PREVIEW
      ========================================================= */

    .media-modal {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: rgba(0, 0, 0, 0.74);

      backdrop-filter: blur(12px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;

      z-index: 1000;
    }

    .media-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .media-window {
      width: min(900px, 95vw);
      max-height: 90vh;

      display: flex;

      overflow: hidden;

      background: #101216;

      border: 1px solid #30353e;

      border-radius: 16px;

      box-shadow: 0 35px 100px rgba(0, 0, 0, 0.7);

      transform: translateY(12px) scale(0.97);

      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .media-description[hidden],
    .media-gallery[hidden],
    .media-empty-state[hidden] {
      display: none;
    }

    .media-window.text-only {
      width: min(560px, 95vw);
    }

    .media-window.text-only .media-description {
      width: 100%;
      min-width: 0;

      border-right: none;
    }

    .media-window.empty-only {
      width: min(520px, 95vw);
      min-height: 280px;
    }

    .media-empty-state {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 32px;

      color: var(--muted);
      font-size: 32px;
      font-weight: 600;
    }

    .media-modal.show .media-window {
      transform: translateY(0) scale(1);
    }

    /* =========================================================
         DESCRIPTION
      ========================================================= */

    .media-description {
      width: 235px;
      min-width: 235px;

      padding: 22px;

      border-right: 1px solid var(--border);

      display: flex;
      flex-direction: column;
    }

    .media-description h2 {
      margin: 0 0 12px;

      font-size: 16px;
      font-weight: 600;
    }

    .description-box {
      width: 100%;

      padding: 12px;

      border: 1px solid #2b3038;

      border-radius: 9px;

      background: #0c0e11;

      color: #aeb5be;

      font-size: 12px;
      line-height: 1.65;

      overflow: auto;
    }

    .description-box.no-description {
      color: #606873;

      font-style: italic;
    }

    /* =========================================================
         GALLERY
      ========================================================= */

    .media-gallery {
      flex: 1;

      min-width: 0;

      padding: 18px;

      display: flex;
      flex-direction: column;
    }

    .gallery-header {
      min-height: 32px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 12px;
    }

    .gallery-counter {
      color: var(--muted);

      font-size: 11px;
    }

    .gallery-grid {
      flex: 1;

      min-height: 280px;

      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      grid-template-rows: repeat(2, minmax(0, 1fr));

      gap: 9px;
    }

    .media-card {
      position: relative;

      min-width: 0;
      min-height: 0;

      overflow: hidden;

      border: 1px solid #2b3038;

      border-radius: 9px;

      background: #090b0e;

      cursor: pointer;

      transition:
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .media-card:hover {
      border-color: var(--blue);

      transform: translateY(-2px);

      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    .media-card img,
    .media-card video {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .media-type {
      position: absolute;

      top: 7px;
      left: 7px;

      padding: 4px 7px;

      border-radius: 5px;

      background: rgba(0, 0, 0, 0.68);

      color: #ffffff;

      font-size: 9px;

      pointer-events: none;
    }

    .media-empty {
      grid-column: 1 / -1;

      grid-row: 1 / -1;

      display: flex;

      align-items: center;
      justify-content: center;

      color: var(--muted);

      font-size: 12px;
    }

    /* =========================================================
         GALLERY CONTROLS
      ========================================================= */

    .gallery-controls {
      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 14px;
    }

    .gallery-button {
      width: 36px;
      height: 32px;

      display: flex;

      align-items: center;
      justify-content: center;

      border: 1px solid #303640;

      border-radius: 7px;

      background: #171a1f;

      color: #d9dde2;

      cursor: pointer;

      font-size: 18px;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .gallery-button:hover {
      background: #22272e;

      color: #ffffff;

      border-color: #464d58;
    }

    .gallery-button:active {
      transform: scale(0.92);
    }

    .gallery-button:disabled {
      opacity: 0.3;

      cursor: default;
    }

    /* =========================================================
         LARGE VIEWER
      ========================================================= */

    .viewer-modal {
      position: fixed;
      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.9);

      backdrop-filter: blur(16px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;

      z-index: 1100;
    }

    .viewer-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .viewer {
      width: min(1000px, 95vw);

      height: min(720px, 88vh);

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #090b0e;

      border: 1px solid #303640;

      border-radius: 15px;

      overflow: hidden;

      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.8);

      transform: scale(0.96);

      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .viewer-modal.show .viewer {
      transform: scale(1);
    }

    .viewer-media {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 55px 70px;

      min-width: 0;
      min-height: 0;
    }

    .viewer-media img,
    .viewer-media video {
      width: 100%;
      height: 100%;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      border-radius: 6px;

      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
    }

    /* =========================================================
         VIEWER CLOSE
      ========================================================= */

    .viewer-close {
      position: absolute;

      top: 14px;
      right: 14px;

      width: 36px;
      height: 36px;

      z-index: 5;

      border: 1px solid #303640;

      border-radius: 8px;

      background: rgba(15, 18, 22, 0.94);

      color: #cbd0d6;

      font-size: 20px;

      cursor: pointer;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    .viewer-close:hover {
      background: #242930;

      color: #ffffff;
    }

    .viewer-close:active {
      transform: scale(0.9);
    }

    /* =========================================================
         VIEWER NAV
      ========================================================= */

    .viewer-nav {
      position: absolute;

      top: 50%;

      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      border: 1px solid #303640;

      border-radius: 50%;

      background: rgba(14, 17, 21, 0.92);

      color: #ffffff;

      font-size: 18px;

      cursor: pointer;

      transform: translateY(-50%);

      z-index: 5;

      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .viewer-nav:hover {
      background: #22272e;

      border-color: #4a525e;
    }

    .viewer-nav:active {
      transform: translateY(-50%) scale(0.9);
    }

    .viewer-nav:disabled {
      opacity: 0.3;

      cursor: default;
    }

    .viewer-prev {
      left: 14px;
    }

    .viewer-next {
      right: 14px;
    }

    /* =========================================================
         VIEWER SOUND
      ========================================================= */

    .viewer-mute {
      position: absolute;

      left: 50%;

      bottom: 14px;

      transform: translateX(-50%);

      height: 34px;

      padding: 0 13px;

      display: none;

      align-items: center;

      gap: 7px;

      border: 1px solid #303640;

      border-radius: 8px;

      background: rgba(15, 18, 22, 0.94);

      color: #dce1e6;

      font-family: inherit;

      font-size: 11px;

      cursor: pointer;

      z-index: 5;

      transition:
        background 0.18s ease,
        color 0.18s ease;
    }

    .viewer-mute.show {
      display: flex;
    }

    .viewer-mute:hover {
      background: #242930;

      color: #ffffff;
    }

    /* =========================================================
         RESPONSIVE
      ========================================================= */

    @media (max-width: 700px) {
      .media-window {
        width: 96vw;

        max-height: 92vh;

        flex-direction: column;
      }

      .media-description {
        width: 100%;
        min-width: 0;

        padding: 15px;

        border-right: none;

        border-bottom: 1px solid var(--border);
      }

      .description-box {
        max-height: 75px;
      }

      .media-gallery {
        min-height: 350px;
      }
    }

    @media (max-width: 520px) {
      .window {
        border-radius: 13px;
      }

      .header {
        padding: 0 16px;
      }

      .item {
        padding: 0 16px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 120px);
      }

      .viewer {
        width: 96vw;
        height: 85vh;
      }

      .viewer-media {
        padding: 50px;
      }
    }
  </style>
  
</head>
<body>
  <!-- =========================================================
         MAIN DELETE WINDOW
    ========================================================== -->

  <div class="window">
    <header class="header">
      <h1 class="title">Delete Mods</h1>
    </header>

    <main class="table" id="table"></main>
  </div>

  <!-- =========================================================
         MEDIA PREVIEW WINDOW
    ========================================================== -->

  <div class="media-modal" id="mediaModal">
    <div class="media-window" id="mediaWindow">
      <aside class="media-description">
        <h2 id="mediaTitle">Mod Name</h2>

        <div class="description-box" id="mediaDescription"></div>
      </aside>

      <section class="media-gallery">
        <div class="gallery-header">
          <span class="gallery-counter" id="galleryCounter"></span>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>

        <div class="gallery-controls">
          <button class="gallery-button" id="galleryPrev" type="button" aria-label="Previous media page">
            ‹
          </button>

          <button class="gallery-button" id="galleryNext" type="button" aria-label="Next media page">
            ›
          </button>
        </div>
      </section>

      <div class="media-empty-state" id="mediaEmptyState" hidden lang="fa" dir="rtl">
        NO Photo and No Text for this Mod
      </div>
    </div>
  </div>

  <!-- =========================================================
         LARGE MEDIA VIEWER
    ========================================================== -->

  <div class="viewer-modal" id="viewerModal">
    <div class="viewer">
      <button class="viewer-close" id="viewerClose" type="button" aria-label="Close">
        ×
      </button>

      <button class="viewer-nav viewer-prev" id="viewerPrev" type="button" aria-label="Previous">
        ‹
      </button>

      <div class="viewer-media" id="viewerMedia"></div>

      <button class="viewer-nav viewer-next" id="viewerNext" type="button" aria-label="Next">
        ›
      </button>

      <button class="viewer-mute" id="viewerMute" type="button">
        🔊 Sound On
      </button>
    </div>
  </div>

  <script>
    /* =========================================================
       MOD DATA

       هر Mod ساختار رسانه‌ای متفاوت دارد.
    ========================================================= */

    const mods = [
      /*
       ---------------------------------------------------------
       MOD 1
       فقط 4 عکس
       ---------------------------------------------------------
      */

      {
        name: "Four Screenshots",

        description: "This mod contains exactly four screenshots.",

        media: [
          {
            type: "image",
            src: "https://picsum.photos/id/10/1200/800",
          },

          {
            type: "image",
            src: "https://picsum.photos/id/20/1200/800",
          },

          {
            type: "image",
            src: "https://picsum.photos/id/30/1200/800",
          },

          {
            type: "image",
            src: "https://picsum.photos/id/40/1200/800",
          },
        ],
      },

      /*
       ---------------------------------------------------------
       MOD 2
       2 عکس + 1 ویدیو
       ---------------------------------------------------------
      */

      {
        name: "Screenshots And Video",

        description: "This mod contains two screenshots and one video.",

        media: [
          {
            type: "image",
            src: "https://picsum.photos/id/50/1200/800",
          },

          {
            type: "image",
            src: "https://picsum.photos/id/60/1200/800",
          },

          {
            type: "video",
            src: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
          },
        ],
      },

      /*
       ---------------------------------------------------------
       MOD 3
       فقط GIF
       ---------------------------------------------------------
      */

      {
        name: "Animated GIF",

        description: "This mod contains only one animated GIF.",

        media: [
          {
            type: "gif",
            src: "https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif",
          },
        ],
      },

      /*
       ---------------------------------------------------------
       MOD 4
       فقط متن
       بدون هیچ Media
       ---------------------------------------------------------
      */

      {
        name: "Text Only",

        description:
          "This mod does not contain any image, GIF or video. " +
          "All information about the mod is provided as text only.",

        media: [],
      },

      /*
       ---------------------------------------------------------
       MOD 5
       فقط عکس
       بدون متن
       ---------------------------------------------------------
      */

      {
        name: "Image Only",

        description: "",

        media: [
          {
            type: "image",
            src: "https://picsum.photos/id/70/1400/900",
          },
        ],
      },

      /*
       ---------------------------------------------------------
       MOD 6
       عکس + GIF + ویدیو
       ---------------------------------------------------------
      */

      {
        name: "Mixed Media",

        description:
          "This mod contains an image, an animated GIF " + "and a video.",

        media: [
          {
            type: "image",
            src: "https://picsum.photos/id/80/1200/800",
          },

          {
            type: "gif",
            src: "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",
          },

          {
            type: "video",
            src: "https://www.w3schools.com/html/mov_bbb.mp4",
          },
        ],
      },

      /*
       ---------------------------------------------------------
       MOD 7
       فقط ویدیو
       ---------------------------------------------------------
      */

      {
        name: "Video Only",

        description: "This mod contains only a video.",

        media: [
          {
            type: "video",
            src: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
          },
        ],
      },

      /*
       ---------------------------------------------------------
       MOD 8
       بیشتر از 4 Media
       برای تست Prev / Next صفحه
       ---------------------------------------------------------
      */

      {
        name: "Complete Media Pack",

        description:
          "This mod contains multiple images, GIFs and videos. " +
          "Use the gallery navigation to view all media.",

        media: [
          {
            type: "image",
            src: "https://picsum.photos/id/90/1200/800",
          },

          {
            type: "image",
            src: "https://picsum.photos/id/100/1200/800",
          },

          {
            type: "gif",
            src: "https://media.giphy.com/media/26BRuo6sLetdllPAQ/giphy.gif",
          },

          {
            type: "video",
            src: "https://www.w3schools.com/html/mov_bbb.mp4",
          },

          {
            type: "image",
            src: "https://picsum.photos/id/110/1200/800",
          },

          {
            type: "image",
            src: "https://picsum.photos/id/120/1200/800",
          },

          {
            type: "gif",
            src: "https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif",
          },

          {
            type: "video",
            src: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
          },
        ],
      },

      {
        name: "Empty Mod",
        description: "",
        media: [],
      },
    ];

    /* =========================================================
       MAIN ELEMENTS
    ========================================================= */

    const table = document.getElementById("table");

    /* =========================================================
       MEDIA STATE
    ========================================================= */

    let currentMod = null;

    let galleryPage = 0;

    let viewerIndex = 0;

    const mediaPerPage = 4;

    /* =========================================================
       CREATE MAIN ITEMS
    ========================================================= */

    mods.forEach((mod, index) => {
      table.appendChild(createItem(mod, index));
    });

    /* =========================================================
       CREATE ITEM
    ========================================================= */

    function createItem(mod, index) {
      const item = document.createElement("div");

      item.className = "item";

      item.dataset.index = index;

      item.innerHTML = `

          <span class="item-text">
          </span>


          <div class="delete-container">

            <button
              class="trash-button"
              type="button"
              aria-label="Delete"
            >

              <svg
                class="trash-icon"
                viewBox="0 0 24 24"
                fill="none"
              >

                <path
                  class="trash-lid"
                  d="M4 7H20"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

                <path
                  class="trash-lid"
                  d="M9 7V5.5C9 4.67 9.67 4 10.5 4H13.5C14.33 4 15 4.67 15 5.5V7"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

                <path
                  class="trash-body"
                  d="M6.5 7L7.25 18.8C7.32 20.02 8.33 21 9.55 21H14.45C15.67 21 16.68 20.02 16.75 18.8L17.5 7"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <path
                  class="trash-body"
                  d="M9.5 10.5V17.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />

                <path
                  class="trash-body"
                  d="M14.5 10.5V17.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />

              </svg>

            </button>


            <div class="confirm">

              <span class="confirm-text">
                Are you sure?
              </span>

              <button
                class="confirm-button yes"
                type="button"
              >
                Yes
              </button>

              <button
                class="confirm-button no"
                type="button"
              >
                No
              </button>

            </div>


            <div class="progress">

              <svg viewBox="0 0 26 26">

                <circle
                  class="progress-track"
                  cx="13"
                  cy="13"
                  r="11"
                />

                <circle
                  class="progress-bar"
                  cx="13"
                  cy="13"
                  r="11"
                />

              </svg>

            </div>


            <div class="success-check"></div>

          </div>
        `;

      item.querySelector(".item-text").textContent =
        `${index + 1}. ${mod.name || ""}`;

      setupDelete(item);

      /*
       ========================================================
       RIGHT CLICK ON MOD
       ========================================================

       مهم:
       contextmenu مستقیماً روی item ثبت شده.
      */

      item.addEventListener("contextmenu", (event) => {
        event.preventDefault();

        event.stopPropagation();

        openMediaModal(mod);
      });

      return item;
    }

    /* =========================================================
       DELETE SYSTEM
    ========================================================= */

    function setupDelete(item) {
      const trash = item.querySelector(".trash-button");

      const confirm = item.querySelector(".confirm");

      const yes = item.querySelector(".yes");

      const no = item.querySelector(".no");

      const progress = item.querySelector(".progress");

      const progressBar = item.querySelector(".progress-bar");

      const success = item.querySelector(".success-check");

      trash.addEventListener("click", (event) => {
        event.stopPropagation();

        document.querySelectorAll(".confirm.show").forEach((box) => {
          if (box !== confirm) {
            box.classList.remove("show");
          }
        });

        confirm.classList.add("show");
      });

      no.addEventListener("click", (event) => {
        event.stopPropagation();

        confirm.classList.remove("show");
      });

      yes.addEventListener("click", (event) => {
        event.stopPropagation();

        confirm.classList.remove("show");

        trash.style.display = "none";

        progress.classList.add("show");

        const duration = 1800;

        const circumference = 69.1;

        let start = null;

        function animate(timestamp) {
          if (!start) {
            start = timestamp;
          }

          const elapsed = timestamp - start;

          const value = Math.min(elapsed / duration, 1);

          progressBar.style.strokeDashoffset =
            circumference - circumference * value;

          if (value < 1) {
            requestAnimationFrame(animate);

            return;
          }

          progress.classList.remove("show");

          success.classList.add("show");

          setTimeout(() => {
            item.classList.add("removing");

            setTimeout(() => {
              item.remove();
            }, 500);
          }, 1200);
        }

        requestAnimationFrame(animate);
      });
    }

    /* =========================================================
       MEDIA MODAL ELEMENTS
    ========================================================= */

    const mediaModal = document.getElementById("mediaModal");

    const mediaWindow = document.getElementById("mediaWindow");

    const mediaDescriptionSection =
      document.querySelector(".media-description");

    const mediaTitle = document.getElementById("mediaTitle");

    const mediaDescription = document.getElementById("mediaDescription");

    const mediaGallery = document.querySelector(".media-gallery");

    const mediaEmptyState = document.getElementById("mediaEmptyState");

    const galleryGrid = document.getElementById("galleryGrid");

    const galleryCounter = document.getElementById("galleryCounter");

    const galleryPrev = document.getElementById("galleryPrev");

    const galleryNext = document.getElementById("galleryNext");

    /* =========================================================
       OPEN MEDIA MODAL
    ========================================================= */

    function openMediaModal(mod) {
      currentMod = mod;

      galleryPage = 0;

      const hasDescription = Boolean(
        mod.description && mod.description.trim(),
      );

      const hasMedia = Boolean(mod.media && mod.media.length);

      mediaTitle.textContent = mod.name || "";

      mediaDescription.textContent = hasDescription ? mod.description : "";

      mediaDescriptionSection.hidden = !hasDescription;

      mediaGallery.hidden = !hasMedia;

      mediaEmptyState.hidden = hasDescription || hasMedia;

      mediaWindow.classList.toggle("text-only", hasDescription && !hasMedia);

      mediaWindow.classList.toggle(
        "empty-only",
        !hasDescription && !hasMedia,
      );

      renderGallery();

      mediaModal.classList.add("show");
    }

    /* =========================================================
       RENDER GALLERY
    ========================================================= */

    function renderGallery() {
      galleryGrid.innerHTML = "";

      if (!currentMod || !currentMod.media || currentMod.media.length === 0) {
        galleryCounter.textContent = "";

        galleryPrev.disabled = true;

        galleryNext.disabled = true;

        return;
      }

      const start = galleryPage * mediaPerPage;

      const end = Math.min(start + mediaPerPage, currentMod.media.length);

      const visibleMedia = currentMod.media.slice(start, end);

      visibleMedia.forEach((media, localIndex) => {
        const realIndex = start + localIndex;

        const card = document.createElement("div");

        card.className = "media-card";

        let element;

        /* ===================================================
             VIDEO
          =================================================== */

        if (media.type === "video") {
          element = document.createElement("video");

          element.src = media.src;

          element.muted = true;

          element.autoplay = true;

          element.loop = true;

          element.playsInline = true;

          /*
           * Video Gallery:
           *
           * Double Click = Sound ON
           *
           * Right Click = Mute
           */

          card.addEventListener("dblclick", (event) => {
            event.preventDefault();

            event.stopPropagation();

            element.muted = false;

            element.volume = 1;

            const playPromise = element.play();

            if (playPromise) {
              playPromise.catch(() => { });
            }
          });

          card.addEventListener("contextmenu", (event) => {
            event.preventDefault();

            event.stopPropagation();

            element.muted = true;
          });
        } else {
          /* ===================================================
             IMAGE / GIF
          =================================================== */
          element = document.createElement("img");

          element.src = media.src;

          element.alt = "";
        }

        card.appendChild(element);

        const label = document.createElement("span");

        label.className = "media-type";

        label.textContent = media.type.toUpperCase();

        card.appendChild(label);

        /*
         * جلوگیری از تداخل Click و Double Click
         *
         * وقتی یک بار کلیک شود:
         * Viewer باز می‌شود.
         *
         * وقتی Double Click شود:
         * برای ویدیو فقط صدا روشن می‌شود.
         */

        let clickTimer = null;

        card.addEventListener("click", (event) => {
          event.stopPropagation();

          if (media.type === "video") {
            clearTimeout(clickTimer);

            clickTimer = setTimeout(() => {
              openViewer(realIndex);
            }, 180);
          } else {
            openViewer(realIndex);
          }
        });

        if (media.type === "video") {
          card.addEventListener("dblclick", () => {
            clearTimeout(clickTimer);
          });
        }

        galleryGrid.appendChild(card);
      });

      galleryCounter.textContent = `${start + 1} - ${end} / ${currentMod.media.length}`;

      galleryPrev.disabled = galleryPage === 0;

      galleryNext.disabled = end >= currentMod.media.length;
    }

    /* =========================================================
       GALLERY NEXT
    ========================================================= */

    galleryNext.addEventListener("click", (event) => {
      event.stopPropagation();

      if (!currentMod) {
        return;
      }

      const nextStart = (galleryPage + 1) * mediaPerPage;

      if (nextStart < currentMod.media.length) {
        galleryPage++;

        renderGallery();
      }
    });

    /* =========================================================
       GALLERY PREVIOUS
    ========================================================= */

    galleryPrev.addEventListener("click", (event) => {
      event.stopPropagation();

      if (galleryPage > 0) {
        galleryPage--;

        renderGallery();
      }
    });

    /* =========================================================
       LARGE VIEWER ELEMENTS
    ========================================================= */

    const viewerModal = document.getElementById("viewerModal");

    const viewer = document.querySelector(".viewer");

    const viewerMedia = document.getElementById("viewerMedia");

    const viewerClose = document.getElementById("viewerClose");

    const viewerPrev = document.getElementById("viewerPrev");

    const viewerNext = document.getElementById("viewerNext");

    const viewerMute = document.getElementById("viewerMute");

    /* =========================================================
       OPEN VIEWER
    ========================================================= */

    function openViewer(index) {
      if (!currentMod || !currentMod.media || !currentMod.media[index]) {
        return;
      }

      viewerIndex = index;

      renderViewer();

      viewerModal.classList.add("show");
    }

    /* =========================================================
       RENDER VIEWER
    ========================================================= */

    function renderViewer() {
      viewerMedia.innerHTML = "";

      viewerMute.classList.remove("show");

      if (
        !currentMod ||
        !currentMod.media ||
        !currentMod.media[viewerIndex]
      ) {
        return;
      }

      const media = currentMod.media[viewerIndex];

      let element;

      /* =======================================================
         VIDEO VIEWER
      ======================================================= */

      if (media.type === "video") {
        element = document.createElement("video");

        element.src = media.src;

        element.autoplay = true;

        element.controls = true;

        element.playsInline = true;

        element.volume = 1;

        element.muted = false;

        viewerMute.classList.add("show");

        updateMuteButton(element);

        /*
         * Right Click:
         * Mute
         */

        element.addEventListener("contextmenu", (event) => {
          event.preventDefault();

          event.stopPropagation();

          element.muted = true;

          updateMuteButton(element);
        });

        /*
         * تلاش برای اجرای ویدیو با صدا
         *
         * اگر Browser اجازه نداد،
         * دکمه Sound همچنان قابل استفاده است.
         */

        const playPromise = element.play();

        if (playPromise) {
          playPromise.catch(() => {
            element.muted = true;

            updateMuteButton(element);
          });
        }

        /*
         * Sound Button
         */

        viewerMute.onclick = (event) => {
          event.stopPropagation();

          element.muted = !element.muted;

          if (!element.muted) {
            element.volume = 1;

            const playPromise = element.play();

            if (playPromise) {
              playPromise.catch(() => { });
            }
          }

          updateMuteButton(element);
        };
      } else {
        /* =======================================================
         IMAGE / GIF VIEWER
      ======================================================= */
        element = document.createElement("img");

        element.src = media.src;

        element.alt = "";
      }

      viewerMedia.appendChild(element);

      /*
       * Prev / Next
       * روی تمام Media
       */

      viewerPrev.disabled = viewerIndex === 0;

      viewerNext.disabled = viewerIndex === currentMod.media.length - 1;
    }

    /* =========================================================
       UPDATE SOUND BUTTON
    ========================================================= */

    function updateMuteButton(video) {
      if (video.muted) {
        viewerMute.textContent = "🔇 Sound Off";
      } else {
        viewerMute.textContent = "🔊 Sound On";
      }
    }

    /* =========================================================
       VIEWER PREVIOUS
    ========================================================= */

    viewerPrev.addEventListener("click", (event) => {
      event.stopPropagation();

      if (!currentMod) {
        return;
      }

      if (viewerIndex > 0) {
        viewerIndex--;

        renderViewer();
      }
    });

    /* =========================================================
       VIEWER NEXT
    ========================================================= */

    viewerNext.addEventListener("click", (event) => {
      event.stopPropagation();

      if (!currentMod) {
        return;
      }

      if (viewerIndex < currentMod.media.length - 1) {
        viewerIndex++;

        renderViewer();
      }
    });

    /* =========================================================
       CLOSE VIEWER
    ========================================================= */

    function closeViewer() {
      viewerModal.classList.remove("show");

      viewerMedia.innerHTML = "";
    }

    viewerClose.addEventListener("click", (event) => {
      event.stopPropagation();

      closeViewer();
    });

    /* =========================================================
       CLICK OUTSIDE VIEWER
    ========================================================= */

    viewerModal.addEventListener("click", (event) => {
      if (event.target === viewerModal) {
        closeViewer();
      }
    });

    /*
     * جلوگیری از بسته شدن Viewer
     * هنگام کلیک داخل خود Viewer
     */

    viewer.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    /* =========================================================
       CLOSE MEDIA MODAL
    ========================================================= */

    function closeMediaModal() {
      mediaModal.classList.remove("show");
    }

    mediaModal.addEventListener("click", (event) => {
      if (event.target === mediaModal) {
        closeMediaModal();
      }
    });

    mediaWindow.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    /* =========================================================
       CLOSE CONFIRMATIONS
    ========================================================= */

    document.addEventListener("click", () => {
      document.querySelectorAll(".confirm.show").forEach((box) => {
        box.classList.remove("show");
      });
    });

    /* =========================================================
       ESC KEY
    ========================================================= */

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") {
        return;
      }

      /*
       * اول Viewer
       */

      if (viewerModal.classList.contains("show")) {
        closeViewer();

        return;
      }

      /*
       * بعد Preview
       */

      if (mediaModal.classList.contains("show")) {
        closeMediaModal();
      }
    });
  </script>
</body>
</html>
