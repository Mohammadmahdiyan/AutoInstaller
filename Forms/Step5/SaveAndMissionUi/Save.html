<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Single Select</title>

    <style>
      :root {
        --blue: oklch(74.6% 0.16 232.661);

        --background: #08090b;
        --window: #101216;
        --item: #12151a;
        --hover: #181c22;
        --border: #272c34;

        --text: #f1f3f5;
        --muted: #858d99;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
          radial-gradient(
            circle at 50% 0%,
            color-mix(in oklch, var(--blue) 10%, transparent),
            transparent 45%
          ),
          var(--background);

        font-family: "Segoe UI", Arial, sans-serif;

        color: var(--text);
      }

      /* Window */

      .window {
        width: 500px;
        max-width: calc(100vw - 24px);

        background: var(--window);

        border: 1px solid #22262d;
        border-radius: 16px;

        overflow: hidden;

        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px rgba(255, 255, 255, 0.025);
      }

      /* Header */

      .header {
        height: 64px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 20px;

        border-bottom: 1px solid var(--border);
      }

      .title {
        margin: 0;

        font-size: 16px;
        font-weight: 600;
      }

      .selected-count {
        min-width: 26px;
        height: 26px;

        padding: 0 8px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 999px;

        background: #0c0f13;
        border: 1px solid #292e36;

        color: var(--muted);

        font-size: 12px;

        transition:
          color 0.25s ease,
          border-color 0.25s ease,
          background 0.25s ease;
      }

      .selected-count.active {
        color: var(--blue);

        border-color: color-mix(in oklch, var(--blue) 40%, #292e36);

        background: color-mix(in oklch, var(--blue) 8%, #0c0f13);
      }

      /* Item */

      .item {
        min-height: 58px;

        display: flex;
        align-items: center;

        direction: ltr;

        padding: 0 20px;

        cursor: pointer;
        user-select: none;

        border-bottom: 1px solid var(--border);

        transition:
          background 0.22s ease,
          transform 0.22s ease,
          border-color 0.22s ease;
      }

      .item:last-child {
        border-bottom: none;
      }

      /* Hover */

      .item:hover {
        background: var(--hover);

        border-bottom-color: #343a44;
      }

      /* Active item */

      .item:has(.checkbox:checked) {
        background: color-mix(in oklch, var(--blue) 8%, var(--item));
      }

      /* Text */

      .item-text {
        flex: 1;

        text-align: left;

        color: #dfe3e8;

        font-size: 14px;
        font-weight: 500;

        transition: color 0.2s ease;
        text-transform: capitalize;
      }

      .item:hover .item-text {
        color: #ffffff;
      }

      .item:has(.checkbox:checked) .item-text {
        color: #ffffff;
      }

      /* Checkbox */

      .checkbox-container {
        width: 22px;
        height: 22px;

        flex-shrink: 0;

        position: relative;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .checkbox {
        position: absolute;

        width: 1px;
        height: 1px;

        opacity: 0;
      }

      /* Checkpoint */

      .checkmark {
        width: 20px;
        height: 20px;

        position: relative;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 1.5px solid #3a414b;

        border-radius: 6px;

        background: #181c21;

        transition:
          background 0.22s ease,
          border-color 0.22s ease,
          box-shadow 0.28s ease,
          transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      /*
      تیک کاملاً وسط قرار می‌گیرد.
      به جای margin-top از position استفاده شده
      تا مرکز هندسی دقیق باشد.
    */

      .checkmark::after {
        content: "";

        position: absolute;

        width: 5px;
        height: 9px;

        left: 50%;
        top: 50%;

        border: solid #071014;
        border-width: 0 2px 2px 0;

        transform: translate(-50%, -58%) rotate(45deg) scale(0.3);

        transform-origin: center;

        opacity: 0;

        transition:
          opacity 0.15s ease,
          transform 0.28s cubic-bezier(0.2, 0.9, 0.2, 1.35);
      }

      /* Checked */

      .checkbox:checked + .checkmark {
        background: var(--blue);

        border-color: var(--blue);

        box-shadow:
          0 0 0 4px color-mix(in oklch, var(--blue) 12%, transparent),
          0 0 20px color-mix(in oklch, var(--blue) 24%, transparent);

        transform: scale(1.05);
      }

      .checkbox:checked + .checkmark::after {
        opacity: 1;

        transform: translate(-50%, -58%) rotate(45deg) scale(1);
      }

      /* Animation */

      .checkmark.pop {
        animation: checkPop 0.42s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      @keyframes checkPop {
        0% {
          transform: scale(0.75);
        }

        45% {
          transform: scale(1.18);
        }

        70% {
          transform: scale(0.98);
        }

        100% {
          transform: scale(1.05);
        }
      }

      /* Focus */

      .checkbox:focus-visible + .checkmark {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
    </style>
  </head>

  <body>
    <div class="window">
      <div class="header">
        <h1 class="title">Select Item</h1>

        <div class="selected-count" id="selectedCount">0</div>
      </div>

      <div class="table">
        <label class="item">
          <span class="item-text"> SAVE FILE 1 NOT PRESENT </span>

          <span class="checkbox-container">
            <!--
            radio باعث می‌شود فقط یک مورد
            در هر لحظه قابل انتخاب باشد.
          -->
            <input
              type="radio"
              name="selectedItem"
              class="checkbox"
              value="Item 1"
            />

            <span class="checkmark"></span>
          </span>
        </label>

        <label class="item">
          <span class="item-text"> SAVE FILE 2 NOT PRESENT </span>

          <span class="checkbox-container">
            <input
              type="radio"
              name="selectedItem"
              class="checkbox"
              value="Item 2"
            />

            <span class="checkmark"></span>
          </span>
        </label>

        <label class="item">
          <span class="item-text"> SAVE FILE 3 NOT PRESENT </span>

          <span class="checkbox-container">
            <input
              type="radio"
              name="selectedItem"
              class="checkbox"
              value="Item 3"
            />

            <span class="checkmark"></span>
          </span>
        </label>

        <label class="item">
          <span class="item-text"> SAVE FILE 4 NOT PRESENT </span>

          <span class="checkbox-container">
            <input
              type="radio"
              name="selectedItem"
              class="checkbox"
              value="Item 4"
            />

            <span class="checkmark"></span>
          </span>
        </label>

        <label class="item">
          <span class="item-text"> SAVE FILE 5 NOT PRESENT </span>

          <span class="checkbox-container">
            <input
              type="radio"
              name="selectedItem"
              class="checkbox"
              value="Item 5"
            />

            <span class="checkmark"></span>
          </span>
        </label>

        <label class="item">
          <span class="item-text"> SAVE FILE 6 NOT PRESENT </span>

          <span class="checkbox-container">
            <input
              type="radio"
              name="selectedItem"
              class="checkbox"
              value="Item 6"
            />

            <span class="checkmark"></span>
          </span>
        </label>

        <label class="item">
          <span class="item-text"> SAVE FILE 7 NOT PRESENT </span>

          <span class="checkbox-container">
            <input
              type="radio"
              name="selectedItem"
              class="checkbox"
              value="Item 7"
            />

            <span class="checkmark"></span>
          </span>
        </label>

        <label class="item">
          <span class="item-text"> SAVE FILE 8 NOT PRESENT </span>

          <span class="checkbox-container">
            <input
              type="radio"
              name="selectedItem"
              class="checkbox"
              value="Item 8"
            />

            <span class="checkmark"></span>
          </span>
        </label>
      </div>
    </div>

    <script>
      const checkboxes = document.querySelectorAll(".checkbox");

      const selectedCount = document.getElementById("selectedCount");

      function updateSelectedItem() {
        const selected = document.querySelector(".checkbox:checked");

        if (selected) {
          // گرفتن شماره آیتم از value
          const itemNumber = selected.value.replace("Item ", "");

          selectedCount.textContent = itemNumber;

          selectedCount.classList.add("active");
        } else {
          selectedCount.textContent = "0";

          selectedCount.classList.remove("active");
        }
      }

      checkboxes.forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          const checkmark = checkbox.nextElementSibling;

          // اجرای دوباره انیمیشن
          checkmark.classList.remove("pop");

          void checkmark.offsetWidth;

          checkmark.classList.add("pop");

          updateSelectedItem();
        });
      });

      updateSelectedItem();
    </script>
  </body>
</html>
