<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mod Status</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f3f5;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        color: #222;
      }

      .window {
        width: 430px;
        background: #fff;
        border: 1px solid #d8d8d8;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .titlebar {
        padding: 15px 20px;
        font-size: 17px;
        font-weight: 600;
        border-bottom: 1px solid #e8e8e8;
      }

      .table {
        padding: 0;
      }

      .row {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 26px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .row:hover {
        background: #f5f6f7;
      }

      .separator {
        height: 1px;
        margin: 0 14px;
        background: #e9e9e9;
      }

      .info {
        min-width: 0;
        text-align: left;
      }

      .name,
      .replacement-name {
        font-size: 14px;
        font-weight: 500;
        line-height: normal;
        color: #222;
        text-transform: capitalize;
      }

      .replacement {
        margin-top: 4px;
        margin-left: 8px;
        color: #777;
        font-size: 13px;
        font-weight: 400;
      }

      .status {
        width: 25px;
        text-align: right;
        font-size: 20px;
        font-weight: 700;
      }

      .yes {
        color: #18a957;
      }

      .no {
        color: #d64545;
      }
    </style>
  </head>

  <body>
    <div class="window">
      <div class="titlebar">وضعیت مد</div>

      <div class="table">
        <div class="row">
          <div class="info">
            <div class="name">molotov</div>
            <div class="replacement">
              =&gt; <span class="replacement-name">molotov</span>
            </div>
          </div>

          <span class="status yes">✓</span>
        </div>

        <div class="separator"></div>

        <div class="row">
          <div class="info">
            <div class="name">grenade</div>
            <div class="replacement">
              =&gt; اسم تغییر کرد به
              <span class="replacement-name">teargas</span>
            </div>
          </div>

          <span class="status yes">✓</span>
        </div>

        <div class="separator"></div>

        <div class="row">
          <div class="info">
            <div class="name">callphone</div>
          </div>

          <span class="status no">×</span>
        </div>

        <div class="separator"></div>

        <div class="row">
          <div class="info">
            <div class="name">zxx</div>
            <div class="replacement">
              =&gt; اسم تغییر کرد به
              <span class="replacement-name">fcr900</span>
            </div>
          </div>

          <span class="status yes">✓</span>
        </div>
      </div>
    </div>
  </body>
</html>
